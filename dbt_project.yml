# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'demo_client_dbt'
version: '1.0.0'

config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'analytics'


require-dbt-version: [">=1.3.0", "<2.0.0"]

# These below vars determine which platforms and/or report types are enabled for you client
# Update these using the dbt_vars.json file uploaded in your customer's Alli Data Library 2.0 Refresh app 
# See https://agencypmg.atlassian.net/wiki/spaces/PTD/pages/2917924898/Building+and+refreshing+a+Data+Library+report
vars:
  vars: # Replace these with the client slug name
  alli_client_slug: demo
  alli_client_slug_core: demo_core
  alli_client_slug_custom: demo_custom

# These configurations specify where dbt should look for different types of files.
# The `source-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
    - "target"
    - "dbt_modules"
    - "dbt_packages"


quoting:
   database:  "{{ true if target.type != 'snowflake' else false }}"
   schema: true
   identifier: true


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.


models:
  demo_client_dbt:
    archive:
      enabled: false
    1_base:
      materialized: view
    2_platform:
      materialized: table
    3_channel:
      materialized: table
    4_report:
      materialized: table

  post-hook:
    - "{{ grant_select(this) }}"



on-run-end:
  - "{{ grant_permissions(schemas, target.name, target.schema ) }}"
